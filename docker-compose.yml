services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: forneos
    ports:
      - "5432:5432"

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_DRIVER: postgres
      DB_DSN: host=db user=postgres password=postgres dbname=forneos port=5432 sslmode=disable
    depends_on:
      - db